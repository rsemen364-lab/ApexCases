<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ApexCases Premium — Кибер Симулятор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-decor b-circle1"></div>
    <div class="bg-decor b-circle2"></div>

   <header class="header">
    <div class="logo">⚡ APEXCASES <span class="logo-tag">PREMIUM</span></div>
    <div class="balance-container">
        <span>Баланс: $<span id="balance-val">10,000</span></span>
        <button id="btn-free-money" onclick="getFreeMoney()">+$500</button>
        <button class="btn-admin-gear" onclick="openAdminPanel()" title="Админ-панель">⚙️</button>
    </div>
</header>

    <main class="main-container">
        <section class="case-section">
            <h2>«Стартовый капитал» <span class="case-price">$100</span></h2>
            <div class="roulette-wrapper">
                <div class="roulette-tape" id="tape-case1"></div>
            </div>
            <div class="case-actions">
                <button class="btn-action" onclick="spin('case1')">Открыть кейс</button>
            </div>
            <div class="loot-preview" id="preview-case1"></div>
        </section>

        <section class="case-section">
            <h2>«Элитный Автопарк» <span class="case-price">$5,000</span></h2>
            <div class="roulette-wrapper">
                <div class="roulette-tape" id="tape-case2"></div>
            </div>
            <div class="case-actions">
                <button class="btn-action" onclick="spin('case2')">Открыть кейс</button>
            </div>
            <div class="loot-preview" id="preview-case2"></div>
        </section>

        <section class="case-section">
            <h2>«Риск: 50 / 50» <span class="case-price">$500</span></h2>
            <div class="wheel-wrapper">
                <div class="wheel-area type-fifty">
                    <div class="wheel-arrow" id="arrow-wheel1"></div>
                    <div class="wheel-center-pin"></div>
                    <div id="wheel-wheel1"></div>
                </div>
            </div>
            <div class="case-actions">
                <button class="btn-action" onclick="spin('wheel1')">Испытать удачу</button>
            </div>
            <div class="loot-preview" id="preview-wheel1"></div>
        </section>

        <section class="case-section">
            <h2>«Джекпот: 20 / 80» <span class="case-price">$2,500</span></h2>
            <div class="wheel-wrapper">
                <div class="wheel-area type-jackpot">
                    <div class="wheel-arrow" id="arrow-wheel2"></div>
                    <div class="wheel-center-pin"></div>
                    <div id="wheel-wheel2"></div>
                </div>
            </div>
            <div class="case-actions">
                <button class="btn-action" onclick="spin('wheel2')">Сорвать Куш</button>
            </div>
            <div class="loot-preview" id="preview-wheel2"></div>
        </section>

        <section class="case-section">
            <h2>«Всё или Ничего» (СТАВКА БАЛАНСА) <span class="case-price">$100,000</span></h2>
            <div class="wheel-wrapper">
                <div class="wheel-area type-mega">
                    <div class="wheel-arrow" id="arrow-wheelMega"></div>
                    <div class="wheel-center-pin"></div>
                    <div id="wheel-wheelMega"></div>
                </div>
            </div>
            <div class="case-actions">
                <button class="btn-action" onclick="spin('wheelMega')">Поставить всё на кон</button>
            </div>
            <div class="loot-preview" id="preview-wheelMega"></div>
        </section>
    </main>

    <div id="admin-modal" class="image-modal-overlay">
        <div id="admin-stage-pass">
            <div style="color:#fff; font-size:18px; margin-bottom:15px;">Введи секретный пароль:</div>
            <input id="admin-pass-field" type="password" style="padding:10px; border-radius:8px; border:2px solid #232336; background:#0a0a14; color:#fff; font-size:16px; width:250px;">
            <div style="margin-top:15px; display:flex; gap:10px;">
                <button class="btn-action" onclick="submitAdminPassword()">Войти</button>
                <button class="btn-action" onclick="closeAdminPanel()" style="background:#333;">Отмена</button>
            </div>
        </div>
        <div id="admin-stage-money" style="display:none;">
            <div style="color:#00ff66; font-size:18px; margin-bottom:15px;">Пароль верный!</div>
            <div style="color:#fff; font-size:16px; margin-bottom:10px;">Сколько денег начислить?</div>
            <input id="admin-money-field" type="number" style="padding:10px; border-radius:8px; border:2px solid #232336; background:#0a0a14; color:#fff; font-size:16px; width:250px;">
            <div style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn-action" onclick="submitAdminMoney()">Зачислить</button>
                <button class="btn-action" onclick="resetAdminBalance()" style="background:#990000;">Сбросить до $10k</button>
                <button class="btn-action" onclick="closeAdminPanel()" style="background:#333;">Закрыть панель</button>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="script.js"></script>
</body>
</html>
