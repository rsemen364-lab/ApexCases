<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ ApexCases Premium — Кибер Симулятор</title>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ ApexCases Premium — Топовый Симулятор Кейсов Онлайн</title>
    
    <!-- Описание сайта для поисковой выдачи -->
    <meta name="description" content="Играй в лучший симулятор кейсов ApexCases Premium! Открывай крутые киберспортивные кейсы, крути колесо фортуны 50/50 и сорви джекпот. Честный рандом, читы и крутой неоновый дизайн.">
    
    <!-- Ключевые слова, по которым вас будут искать -->
    <meta name="keywords" content="apex cases, apex cases premium, симулятор кейсов, открытие кейсов, колесо фортуны 50 на 50, крутить кейсы, симулятор кейсов онлайн">
    
    <link rel="stylesheet" href="style.css">
</head>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Живой декоративный задний план -->
    <div class="bg-decor b-circle1"></div>
    <div class="bg-decor b-circle2"></div>

    <!-- ВОТ ЭТОТ БЛОК ИЗМЕНИЛСЯ (Добавлена шестеренка ⚙️) -->
    <div class="header">
        <div class="logo">⚡ APEXCASES <span class="logo-tag">PREMIUM</span></div>
        <div class="balance-container" style="position: relative; display: flex; align-items: center; gap: 15px;">
            <!-- Секретная кнопка админа -->
            <button onclick="openAdminPanel()" style="background: none; border: none; cursor: pointer; font-size: 16px; padding: 0 5px; opacity: 0.6; transition: opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.6">⚙️</button>
            <span class="balance">Баланс: $<span id="balance-val">10,000</span></span>
            <button class="btn-action" id="btn-free-money" onclick="getFreeMoney()" style="padding: 8px 15px; font-size: 14px; background: linear-gradient(135deg, #00ff66 0%, #00aa44 100%); box-shadow: 0 0 15px rgba(0, 255, 102, 0.3); border-radius: 20px;">+$500</button>
        </div>
    </div>

    <div class="main-container">
        
        <!-- КЕЙС 1 (ЛЕНТА) -->
        <div class="case-section" id="case1-section">
            <h2>«Стартовый капитал» <span class="case-price">$100</span></h2>
            <div class="roulette-wrapper">
                <div class="roulette-tape" id="tape-case1"></div>
            </div>
            <div class="case-actions">
                <button class="btn-action" id="btn-case1" onclick="spin('case1')">Открыть кейс</button>
            </div>
            <div class="loot-preview" id="preview-case1"></div>
        </div>

        <!-- КЕЙС 2 (ЛЕНТА) -->
        <div class="case-section" id="case2-section">
            <h2>«Элитный Автопарк» <span class="case-price">$5,000</span></h2>
            <div class="roulette-wrapper">
                <div class="roulette-tape" id="tape-case2"></div>
            </div>
            <div class="case-actions">
                <button class="btn-action" id="btn-case2" onclick="spin('case2')">Открыть кейс</button>
            </div>
            <div class="loot-preview" id="preview-case2"></div>
        </div>

        <!-- РЯД ИЗ ДВУХ КОЛЕС ФОРТУНЫ -->
        <div class="wheels-row">
            
            <!-- КОЛЕСО 1 (50/50) -->
            <div class="case-section wheel-card">
                <h2>«Риск: 50 / 50» <span class="case-price">$500</span></h2>
                <div class="wheel-wrapper">
                    <div class="wheel-arrow" id="arrow-wheel1"></div>
                    <div class="wheel-center-pin"></div>
                    <div class="wheel-area type-fifty" id="wheel-wheel1"></div>
                </div>
                <div class="case-actions">
                    <button class="btn-action" id="btn-wheel1" onclick="spin('wheel1')">Испытать удачу</button>
                </div>
                <div class="loot-preview" id="preview-wheel1"></div>
            </div>

            <!-- КОЛЕСО 2 (20/80) -->
            <div class="case-section wheel-card">
                <h2>«Джекпот: 20 / 80» <span class="case-price">$2,500</span></h2>
                <div class="wheel-wrapper">
                    <div class="wheel-arrow" id="arrow-wheel2"></div>
                    <div class="wheel-center-pin"></div>
                    <div class="wheel-area type-jackpot" id="wheel-wheel2"></div>
                </div>
                <div class="case-actions">
                    <button class="btn-action" id="btn-wheel2" onclick="spin('wheel2')">Сорвать Куш</button>
                </div>
                <div class="loot-preview" id="preview-wheel2"></div>
            </div>

        </div>

        <!-- КЕЙС 5 (МЕГА-КОЛЕСО ВСЁ ИЛИ НИЧЕГО — 4 СЕКТОРА) -->
        <div class="case-section">
            <h2>«Всё или Ничего» (СТАВКА БАЛАНСА) <span class="case-price" style="color:#ff3333; background:rgba(255,51,51,0.1); border-color:rgba(255,51,51,0.3);">$100,000</span></h2>
            <div class="wheel-wrapper">
                <div class="wheel-arrow" id="arrow-wheelMega"></div>
                <div class="wheel-center-pin"></div>
                <div class="wheel-area type-mega" id="wheel-wheelMega"></div>
            </div>
            <div class="case-actions">
                <button class="btn-action" id="btn-wheelMega" onclick="spin('wheelMega')" style="background: linear-gradient(135deg, #ff3333 0%, #ff5500 100%); box-shadow: 0 5px 25px rgba(255, 51, 51, 0.3);">Поставить всё на кон</button>
            </div>
            <div class="loot-preview" id="preview-wheelMega"></div>
        </div>

    </div>

    <script src="database.js"></script>
    <script src="script.js"></script>
</body>
</html>
    <!-- СТИЛЬНОЕ АДМИН-ОКНО ПРЯМО ВНУТРИ САЙТА (ОБНОВЛЕНО) -->
    <div id="admin-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000; display: none; justify-content: center; align-items: center;">
        <div style="background: #141420; border: 2px solid #1e1e2f; padding: 30px; border-radius: 20px; box-shadow: 0 0 30px rgba(255, 85, 0, 0.2); text-align: center; width: 320px; box-sizing: border-box;">
            <h3 style="margin-top: 0; font-size: 20px; color: #ff5500;">⚙️ Панель Разработчика</h3>
            
            <!-- Поле для пароля -->
            <div id="admin-stage-pass">
                <p style="font-size: 14px; color: #bdc3c7;">Введи секретный пароль:</p>
                <input type="password" id="admin-pass-field" style="width: 100%; padding: 10px; background: #09090f; border: 2px solid #1e1e2f; border-radius: 8px; color: #fff; text-align: center; margin-bottom: 15px; box-sizing: border-box;">
                <button class="btn-action" onclick="submitAdminPassword()" style="padding: 10px 30px; font-size: 14px; width: 100%; border-radius: 8px;">Войти</button>
            </div>

            <!-- Поле для ввода денег и СБРОСА -->
            <div id="admin-stage-money" style="display: none;">
                <p style="font-size: 14px; color: #00ff66;">Пароль верный!</p>
                <p style="font-size: 14px; color: #bdc3c7;">Сколько денег начислить?</p>
                <input type="number" id="admin-money-field" placeholder="Например: 50000" style="width: 100%; padding: 10px; background: #09090f; border: 2px solid #1e1e2f; border-radius: 8px; color: #fff; text-align: center; margin-bottom: 15px; box-sizing: border-box;">
                <button class="btn-action" onclick="submitAdminMoney()" style="padding: 10px 30px; font-size: 14px; width: 100%; border-radius: 8px; background: linear-gradient(135deg, #00ff66 0%, #00aa44 100%); box-shadow: 0 0 15px rgba(0,255,102,0.2); margin-bottom: 12px;">Зачислить</button>
                
                <!-- НОВАЯ КНОПКА СБРОСА БАЛАНСА -->
                <button class="btn-action" onclick="resetAdminBalance()" style="padding: 10px 30px; font-size: 14px; width: 100%; border-radius: 8px; background: linear-gradient(135deg, #ff3333 0%, #bb1111 100%); box-shadow: 0 0 15px rgba(255,51,51,0.2);">Сбросить до $10k</button>
            </div>

            <button onclick="closeAdminPanel()" style="background: none; border: none; color: #7f8c8d; cursor: pointer; margin-top: 15px; font-size: 13px; text-decoration: underline;">Закрыть панель</button>
        </div>
    </div>
